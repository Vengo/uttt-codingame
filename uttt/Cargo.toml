[package]
name = "uttt"
version = "0.1.0"
authors = ["KellyAnalytics <nrk139@gmail.com>"]
edition = "2021"

[build-dependencies]
clippy = { version = "*", optional = true }

[dev-dependencies]
criterion = "0.3"

[features]
default = []

[dependencies]
itertools = "0.11.0"
rand = { version = "0.8.5", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pprof = { version = "0.13", features = ["flamegraph"] }
memmap2 = "0.9"

[lib]
name = "uttt"
path = "src/lib.rs"

[[bin]]
name = "cg"
path = "src/bin/cg.rs"

[[bin]]
name = "runlocal"
path = "src/bin/runlocal.rs"

[[bin]]
name = "arena"
path = "src/bin/arena.rs"

[[bench]]
name = "uttt_benches"
harness = false

[[bench]]
name = "ttt_benches"
harness = false